name: Deploy Next.js to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Supabase URL
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        run: |
          node -e "
          const raw = process.env.SUPABASE_URL || '';

          console.log('URL length:', raw.length);
          console.log('Starts with https://:', raw.startsWith('https://'));
          console.log('Has leading/trailing whitespace:', raw !== raw.trim());
          console.log('Starts with quote:', raw.startsWith('\"') || raw.startsWith(\"'\"));
          console.log('Ends with quote:', raw.endsWith('\"') || raw.endsWith(\"'\"));

          try {
            const u = new URL(raw.trim());

            console.log('Scheme:', u.protocol);
            console.log('Host:', u.host);
            console.log('Supabase URL: VALID');
          } catch {
            console.error('Supabase URL: INVALID');
            process.exit(1);
          }
          "

      - name: Build Next.js
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4